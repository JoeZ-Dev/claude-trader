# momentum_monitor -- three live services. claude-connector (phase 3,
# specs.md sections 25/27) is the only container with the `claude` CLI's
# OAuth credentials mounted in -- a read-only bind mount of
# CLAUDE_CREDENTIALS_PATH (default the host's own ~/.claude/.credentials.json;
# override in momentum_monitor/.env if the host layout differs). Nothing
# else from the host's ~/.claude is mounted -- the stage-0 investigation
# (specs.md section 25) proved that file alone is sufficient.
#
#   Live Schwab data:  set AUTH_HELPER_URL / INTERNAL_AUTH_SECRET / WATCH_SYMBOL
#                      in momentum_monitor/.env (gitignored -- see RUNBOOK.md
#                      section 1-2 for provisioning), then: docker compose up --build
#                      (SCHWAB_API_KEY / SCHWAB_APP_SECRET are also read here but
#                      NOT functionally required under the companion-auth
#                      credential model -- traced and verified live against the
#                      REST path specifically, see RUNBOOK.md section 3 / specs.md
#                      section 4; leave them unset unless that changes)
#   Replay (no token): STREAM_SOURCE=replay WATCH_SYMBOL=AEHL docker compose up
#
# Networks:
#   monitor-net     internal; carries only monitor-app <-> schwab-connector.
#   joelab-ingress  pre-existing EXTERNAL network. schwab-connector joins it
#                   solely to reach the joelab auth helper by Docker service
#                   name (http://companion-auth:<port>/access_token) -- token
#                   requests must never leave the host. The public
#                   https://companion-auth.p3l.co URL + Cloudflare Tunnel exist
#                   only for Schwab's servers to hit the OAuth callback, and are
#                   not used for service-to-service calls.
#   monitor-app does NOT join joelab-ingress: it never talks to Schwab or the
#   auth helper directly. That exposure stays scoped to schwab-connector.
#
# Only monitor-app publishes a port (8012). schwab-connector binds 7878 and
# is `expose`-only -- reachable on the docker networks, never on a host port.

services:
  claude-connector:
    build:
      context: .
      dockerfile: claude-connector/Dockerfile
    expose:
      - "7879"
    environment:
      CLAUDE_TIMEOUT_SECONDS: "${CLAUDE_TIMEOUT_SECONDS:-30}"
    volumes:
      # Read-only, and ONLY this one file -- the stage-0 investigation
      # (specs.md section 25) proved nothing else from the host's
      # ~/.claude is needed. compose does NOT shell-expand "~", so this
      # MUST be set to an absolute path in momentum_monitor/.env (e.g.
      # CLAUDE_CREDENTIALS_PATH=/home/<user>/.claude/.credentials.json)
      # -- same "explicit fill-in required, no silent default" treatment
      # as AUTH_HELPER_URL/INTERNAL_AUTH_SECRET above. An unset value
      # here bind-mounts nothing usable and every /narrate call fails
      # loudly (never silently) via claude_cli's own FileNotFoundError
      # handling.
      - "${CLAUDE_CREDENTIALS_PATH:?set CLAUDE_CREDENTIALS_PATH in .env to the host's absolute ~/.claude/.credentials.json path}:/root/.claude/.credentials.json:ro"
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7879/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  schwab-connector:
    build:
      context: .
      dockerfile: schwab-connector/Dockerfile
    expose:
      - "7878"
    environment:
      STREAM_SOURCE: "${STREAM_SOURCE:-schwab}"
      BAR_DB_DIR: /data/bars
      SCHWAB_API_KEY: "${SCHWAB_API_KEY:-}"
      SCHWAB_APP_SECRET: "${SCHWAB_APP_SECRET:-}"
      REPLAY_PATH: "${REPLAY_PATH:-/app/fixtures/replay_sample.jsonl}"
      # Live mode only. Full URL of the joelab auth helper, reached by service
      # name on joelab-ingress. Port is pinned by the joelab side -- fill it in:
      #   AUTH_HELPER_URL=http://companion-auth:<port>
      AUTH_HELPER_URL: "${AUTH_HELPER_URL:-}"
      # Shared secret sent as X-Internal-Auth on every companion-auth request.
      # Must match INTERNAL_AUTH_SECRET in companion-auth's own .env.
      INTERNAL_AUTH_SECRET: "${INTERNAL_AUTH_SECRET:-}"
    volumes:
      - ./schwab-connector/data:/data
    networks:
      - monitor-net
      - joelab-ingress
    restart: unless-stopped
    healthcheck:
      # /health always returns 200 once FastAPI is up, live or replay mode,
      # regardless of "connected" -- this is a readiness probe, not a
      # Schwab-stream-up probe. monitor-app's depends_on waits on this so its
      # one-shot POST /watch on startup lands after uvicorn is actually
      # listening, not just after the container process has started.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7878/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  monitor-app:
    build:
      context: .
      dockerfile: monitor-app/Dockerfile
    ports:
      - "8012:8012"
    environment:
      SCHWAB_CONNECTOR_URL: http://schwab-connector:7878
      CLAUDE_CONNECTOR_URL: http://claude-connector:7879
      WATCH_SYMBOL: "${WATCH_SYMBOL:-}"
      JOURNAL_DB_PATH: /data/journal.db
      # Virtual trade journal trailing-stop percent (specs.md section 6) --
      # a starting point to tune against real logged data, not a validated
      # number.
      TRAIL_PCT: "${TRAIL_PCT:-0.05}"
      # Minimum relative_volume (1.0 = trailing 20-bar average) required,
      # at the moment a setup type confirms, for a virtual entry to fire --
      # same "starting point, not validated" treatment as TRAIL_PCT.
      VOLUME_CONFIRM_THRESHOLD: "${VOLUME_CONFIRM_THRESHOLD:-1.5}"
      # Position sizing with compounding virtual equity (specs.md section
      # 11) -- BASE_EQUITY seeds both the live-tunable base_equity param
      # and current_equity's own starting value on the FIRST-EVER run
      # against a given journal.db; RISK_PCT_PER_TRADE is the fraction of
      # current_equity risked per entry. Both seed-only, same treatment as
      # TRAIL_PCT above -- tune live via POST /api/strategy_params /
      # POST /api/equity/reset|override, not by editing these and
      # redeploying.
      BASE_EQUITY: "${BASE_EQUITY:-2000}"
      RISK_PCT_PER_TRADE: "${RISK_PCT_PER_TRADE:-0.01}"
      # Two-phase exit + session-level volume gate (specs.md section 12) --
      # same seed-only treatment as the params above; tune live via POST
      # /api/strategy_params, not by editing these and redeploying.
      SWING_LOW_BUFFER_PCT: "${SWING_LOW_BUFFER_PCT:-0.005}"
      PATTERN_PROGRESS_THRESHOLD_PCT: "${PATTERN_PROGRESS_THRESHOLD_PCT:-0.03}"
      SESSION_VOLUME_MULTIPLE: "${SESSION_VOLUME_MULTIPLE:-3.0}"
      # Continuation-vs-fresh-day flag (specs.md section 7) --
      # INFORMATIONAL only, never gates an entry; same seed-only
      # treatment as the params above.
      CONTINUATION_LOOKBACK_DAYS: "${CONTINUATION_LOOKBACK_DAYS:-7}"
      CONTINUATION_THRESHOLD_PCT: "${CONTINUATION_THRESHOLD_PCT:-0.5}"
      # Confirmation-freshness gate (specs.md section 20) -- how long a
      # persisted confirmed=True stays actionable for a NEW entry after
      # it was last genuinely reaffirmed; same seed-only treatment as
      # the params above.
      CONFIRMATION_FRESHNESS_SECONDS: "${CONFIRMATION_FRESHNESS_SECONDS:-30}"
      # Reference-target display (specs.md section 21) -- entry_price *
      # (1 + this) shown as an informational reference alongside the
      # real trailing stop; never an exit trigger, same seed-only
      # treatment as the params above.
      TARGET_REFERENCE_PCT: "${TARGET_REFERENCE_PCT:-0.10}"
      # Event-triggered narration (specs.md sections 25/27, phase 3 stage
      # 1) -- both safety-gate thresholds, same seed-only treatment as
      # every other strategy param above; tune live via POST
      # /api/strategy_params, not by editing these and redeploying. Both
      # gates default to disarmed/not-tripped on every fresh start
      # regardless of these values (in-memory state, never persisted) --
      # these only seed the THRESHOLDS, never the armed/tripped state
      # itself.
      NARRATION_MAX_CALLS_PER_WINDOW: "${NARRATION_MAX_CALLS_PER_WINDOW:-10}"
      NARRATION_WINDOW_MINUTES: "${NARRATION_WINDOW_MINUTES:-15}"
      NARRATION_REARM_MINUTES: "${NARRATION_REARM_MINUTES:-60}"
    volumes:
      - ./monitor-app/data:/data
    depends_on:
      schwab-connector:
        condition: service_healthy
      # Deliberately NOT a hard dependency on claude-connector's health:
      # narration is an optional, human-armed capability (disarmed by
      # default on every start), never load-bearing for the rest of this
      # app. If claude-connector is slow/unhealthy/down, monitor-app
      # still starts and runs the actual live monitoring fine -- a
      # narration call just fails per-attempt (caught, logged, surfaced
      # in the UI status), the same graceful-degradation treatment
      # fetch_daily_bars/fetch_market_backdrop already get.
      claude-connector:
        condition: service_started
    networks:
      - monitor-net
    restart: unless-stopped

networks:
  monitor-net:
    driver: bridge
  joelab-ingress:
    external: true
